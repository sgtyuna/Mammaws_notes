<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mammaw's Notes</title>
  <meta name="description" content="A gentle, private journal for visits with an elderly loved one. Everything stays on your device.">
  <meta name="theme-color" content="#f7f1e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#211c18" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mammaw's Notes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="sheet" hidden></div>
  <div id="dialog" hidden></div>
  <div id="toast" role="status" hidden></div>
  <noscript><p style="padding:24px">Mammaw's Notes needs JavaScript turned on.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
